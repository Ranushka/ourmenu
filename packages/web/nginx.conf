server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # nginx's default mime.types has no entry for .mjs, so it falls back to
  # application/octet-stream -- browsers refuse to run a dynamically
  # imported ES module (pdf.js's worker script) served with that MIME
  # type, failing with "Failed to fetch dynamically imported module".
  # default_type (not add_header, which appends rather than replaces and
  # produced an invalid dual "application/octet-stream, application/
  # javascript" value that browsers rejected outright) sets what's used
  # when the extension isn't in mime.types.
  location ~ \.mjs$ {
    default_type application/javascript;
  }

  # SPA fallback — client-side routes like /m/:slug
  location / {
    try_files $uri $uri/ /index.html;
  }
}
